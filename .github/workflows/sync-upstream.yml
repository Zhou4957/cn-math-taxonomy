name: sync-upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and re-apply kid-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git
          git fetch upstream
          git merge --no-commit -X theirs upstream/main || { git checkout --theirs .; git add -A; }
          git rm -rf --ignore-unmatch .github/workflows
          git checkout HEAD -- .github/workflows
          if [ -f .git/MERGE_HEAD ]; then git commit --no-edit; fi
          python3 scripts/kid-clean.py
          if [ -n "$(git status --porcelain)" ]; then git add -A; git commit -m "sync: upstream update + re-apply kid-clean"; fi
          git push origin main
