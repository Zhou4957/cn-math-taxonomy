name: sync-upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync data only from upstream and re-apply kid-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git
          git fetch upstream
          # Upstream moved the website source to a private repo on 2026-11-25
          # (commit 6cb36a8); upstream/main is now data-only. Never merge it:
          # a merge would delete the kid site's frontend (index.html, assets/, ...).
          # Sync only the data tree, including upstream deletions inside data/.
          git rm -r -q --ignore-unmatch data
          git checkout upstream/main -- data
          python3 scripts/kid-clean.py
          if [ -n "$(git status --porcelain)" ]; then git add -A; git commit -m "sync: upstream data update + re-apply kid-clean"; fi
          git push origin main
